{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Create Employee Account</h1>
  <p style="color:var(--muted);font-size:0.88rem;">
    Manager and admin accounts are created by an administrator.
  </p>
  <form method="POST">
    <label>Full Name</label>
    <input type="text" name="name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <label>Department</label>
    <select name="department" required>
      {% for d in departments %}
        <option value="{{ d.department_name }}">{{ d.department_name }}</option>
      {% endfor %}
    </select>
    <button class="btn" type="submit" style="width:100%;">Register</button>
  </form>
  <p style="font-size:0.85rem;margin-top:10px;">
    Already have an account? <a href="{{ url_for('login') }}">Log in</a>
  </p>
</div>
{% endblock %}
